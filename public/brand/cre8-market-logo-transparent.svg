<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 954 257" width="954" height="257" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <style>
      .green  { fill:#6CE97A; }
      .white  { fill:#FAFAF9; }
      .brand-serif { font-family: Georgia, 'Playfair Display', 'Times New Roman', serif; font-weight:900; }
      .brand-sans  { font-family: Arial, Helvetica, sans-serif; font-weight:700; }
    </style>
  </defs>

  <!-- background intentionally omitted: transparent -->

  <!-- ===== building / skyline icon ===== -->
  <g transform="translate(10,14)">
    <!-- left short building with true cut-out windows (evenodd hole) -->
    <path class="green" fill-rule="evenodd" d="
      M0,70 H66 V200 H0 Z
      M10,82 H24 V96 H10 Z
      M30,82 H44 V96 H30 Z
      M50,82 H64 V96 H50 Z
      M10,104 H24 V118 H10 Z
      M30,104 H44 V118 H30 Z
      M50,104 H64 V118 H50 Z
      M10,126 H24 V140 H10 Z
      M30,126 H44 V140 H30 Z
      M50,126 H64 V140 H50 Z
    " />

    <!-- tall center skyscraper -->
    <polygon class="green" points="
      52,70 52,40 66,40 66,20 80,20 80,40 94,40 94,10 108,10 108,40 122,40 122,70
    " />
    <rect class="green" x="52" y="55" width="70" height="90" />

    <!-- storefront with awning + true cut-out door/window holes -->
    <path class="green" fill-rule="evenodd" d="
      M16,150 H166 V210 H16 Z
      M30,172 H60 V210 H30 Z
      M118,172 H148 V210 H118 Z
    " />
    <!-- scalloped awning -->
    <path class="green" d="
      M12,150
      Q22,136 32,150
      Q42,136 52,150
      Q62,136 72,150
      Q82,136 92,150
      Q102,136 112,150
      Q122,136 132,150
      Q142,136 152,150
      Q162,136 172,150
      L172,164 L12,164 Z" />
  </g>

  <!-- divider -->
  <rect class="green" x="200" y="30" width="9" height="180" rx="4" />

  <!-- ===== wordmark ===== -->
  <text class="brand-serif green" x="228" y="148" font-size="100">Cre8</text>
  <text class="brand-serif white" x="503" y="148" font-size="100">Market</text>
  <text class="white" x="918" y="58" font-size="24" font-family="Arial, sans-serif" font-weight="700">&#174;</text>

  <!-- tagline -->
  <text class="brand-sans white" x="230" y="198" font-size="34">Inspire. Innovate. Shop.</text>
</svg>
